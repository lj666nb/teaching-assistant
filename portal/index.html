<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学科助教系统 — 统一入口</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0A1E4A 0%, #0F52BA 40%, #1890ff 70%, #0A1428 100%);
      background-size: 400% 400%;
      animation: gradientShift 12s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* 装饰粒子 */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.06) 0px, transparent 300px),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,0.04) 0px, transparent 400px),
        radial-gradient(circle at 50% 50%, rgba(24,144,255,0.08) 0px, transparent 500px);
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 40px 20px;
    }

    .header {
      margin-bottom: 56px;
    }

    .logo-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #1890ff, #0F52BA);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(24,144,255,0.35);
      animation: logoFloat 3s ease-in-out infinite;
    }

    .logo-icon svg {
      width: 44px;
      height: 44px;
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }

    h1 {
      font-size: 38px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 1px;
      margin-bottom: 12px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.25);
    }

    .subtitle {
      font-size: 16px;
      color: rgba(255,255,255,0.7);
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    .cards {
      display: flex;
      gap: 32px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .card {
      display: block;
      width: 300px;
      padding: 40px 32px;
      border-radius: 20px;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 48px rgba(0,0,0,0.18);
      text-decoration: none;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
    }

    .card::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 4px;
      transition: height 0.3s ease;
    }

    .card.teacher::after {
      background: linear-gradient(90deg, #0F52BA, #1890ff);
    }

    .card.student::after {
      background: linear-gradient(90deg, #52c41a, #73d13d);
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 56px rgba(0,0,0,0.25);
    }

    .card:hover::after {
      height: 6px;
    }

    .card-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }

    .card.teacher .card-icon {
      background: linear-gradient(135deg, #e6f0ff, #b3d4ff);
      color: #0F52BA;
    }

    .card.student .card-icon {
      background: linear-gradient(135deg, #e6ffe6, #b3f0b3);
      color: #389e0d;
    }

    .card h2 {
      font-size: 24px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 10px;
    }

    .card p {
      font-size: 14px;
      color: #666;
      line-height: 1.7;
    }

    .card .role-tag {
      display: inline-block;
      margin-top: 16px;
      padding: 4px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .card.teacher .role-tag {
      background: #e6f0ff;
      color: #0F52BA;
    }

    .card.student .role-tag {
      background: #e6ffe6;
      color: #389e0d;
    }

    .footer {
      margin-top: 56px;
      color: rgba(255,255,255,0.4);
      font-size: 13px;
      letter-spacing: 0.5px;
    }

    /* 响应式 */
    @media (max-width: 700px) {
      .cards { flex-direction: column; align-items: center; gap: 20px; }
      .card { width: 280px; padding: 32px 24px; }
      h1 { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 品牌区 -->
    <div class="header">
      <div class="logo-icon">
        <!-- 书本图标 SVG -->
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="6" y="8" width="16" height="32" rx="2" fill="white" opacity="0.95"/>
          <rect x="26" y="8" width="16" height="32" rx="2" fill="white" opacity="0.75"/>
          <line x1="22" y1="12" x2="26" y2="12" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <line x1="22" y1="18" x2="26" y2="18" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <line x1="22" y1="24" x2="26" y2="24" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <line x1="22" y1="30" x2="26" y2="30" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <circle cx="38" cy="14" r="7" fill="#52c41a" stroke="white" stroke-width="2"/>
          <path d="M36 14 l1.5 1.5 l3-3" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </div>
      <h1>Edu-TA 智教星</h1>
      <p class="subtitle">面向一流学科建设的学科垂类大模型与创新应用</p>
    </div>

    <!-- 入口卡片 -->
    <div class="cards">
      <!-- 教师端 -->
      <a href="http://localhost:5173" class="card teacher">
        <div class="card-icon">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
        </div>
        <h2>教师端</h2>
        <p>智能备课、作业批改、学情洞察、课程管理、AI 助教工作台</p>
        <span class="role-tag">👨‍🏫 教师入口</span>
      </a>

      <!-- 学生端 -->
      <a href="http://localhost:5174" class="card student">
        <div class="card-icon">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            <path d="M12 6v7"/><path d="M9 9l3-3 3 3"/>
          </svg>
        </div>
        <h2>学生端</h2>
        <p>智能答疑、学情自测、学习路径、错题本、编程实验室</p>
        <span class="role-tag">🎓 学生入口</span>
      </a>
    </div>

    <div class="footer">
      挑战杯 · 学科大模型赛道 &nbsp;|&nbsp; 师生协同学习平台
    </div>
  </div>
</body>
</html>
